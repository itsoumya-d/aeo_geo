name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
